<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Itinerarios - Patagonia</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background-color: white;
            width: 100%;
            max-width: 650px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            color: #34495e;
        }
        input, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        button {
            width: 100%;
            padding: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 30px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover { 
            background-color: #2980b9; 
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled { 
            background-color: #95a5a6; 
            cursor: not-allowed; 
        }
        
        #resultados { margin-top: 40px; }
        
        .header-resultados {
            background-color: #e8f6f3;
            color: #1abc9c;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.2em;
        }
        
        .lugar-card {
            background: #ffffff;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 6px solid #3498db;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .lugar-card:hover {
            transform: translateX(5px);
        }
        .lugar-titulo {
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .lugar-datos {
            font-size: 0.95em;
            color: #7f8c8d;
            display: flex;
            justify-content: space-between;
        }
        .loading {
            text-align: center;
            color: #3498db;
            font-weight: bold;
            margin-top: 30px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Planificador IA Patagonia</h1>
        <p class="subtitle">Ingresá tus preferencias y calculamos la mejor ruta</p>

        <form id="viaje-form">
            <label for="dias">¿Cuántos días de viaje tenés?</label>
            <input type="number" id="dias" min="1" max="30" placeholder="Ejemplo: 10" required>

            <label for="preferencias">¿Qué tipo de experiencia buscás?</label>
            <textarea id="preferencias" rows="4" placeholder="Ejemplo: Quiero alejarme de las multitudes, caminar por la montaña y conectar con la naturaleza profunda..." required></textarea>

            <button type="submit" id="btn-submit">Generar Itinerario</button>
        </form>

        <div id="resultados"></div>
    </div>

    <script>
        document.getElementById('viaje-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const dias = document.getElementById('dias').value;
            const preferencias = document.getElementById('preferencias').value;
            const resultadosDiv = document.getElementById('resultados');
            const boton = document.getElementById('btn-submit');

            // Estado de carga
            resultadosDiv.innerHTML = '<div class="loading">Procesando preferencias y calculando rutas... 🧭</div>';
            boton.disabled = true;
            boton.innerText = 'Calculando...';

            try {
                // Al estar servido por FastAPI, usamos una ruta relativa
                const response = await fetch('/planificar-itinerario', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cantidad_dias: parseInt(dias),
                        preferencias: preferencias
                    })
                });

                if (!response.ok) throw new Error('Error en el servidor');
                const data = await response.json();

                // Renderizar resultados
                let htmlResultados = `
                    <div class="header-resultados">
                        ✓ Enfoque detectado por IA: ${data.prioridad_detectada}
                    </div>
                `;
                
                data.itinerario.forEach((item, index) => {
                    const ratingText = item.rating ? `${item.rating} ⭐` : 'Sin rating';
                    const distanciaText = Math.round(item.distancia);
                    
                    htmlResultados += `
                        <div class="lugar-card">
                            <div class="lugar-titulo">Día ${index + 1}: ${item.lugar}</div>
                            <div class="lugar-datos">
                                <span>📍 A ${distanciaText} km del inicio</span>
                                <span>${ratingText}</span>
                            </div>
                        </div>
                    `;
                });

                resultadosDiv.innerHTML = htmlResultados;

            } catch (error) {
                console.error(error);
                resultadosDiv.innerHTML = '<div class="loading" style="color: #e74c3c;">❌ Ocurrió un error. Verificá los logs del servidor.</div>';
            } finally {
                boton.disabled = false;
                boton.innerText = 'Generar Itinerario';
            }
        });
    </script>

</body>
</html>
